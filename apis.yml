name: Unitary AI
description: >-
  Unitary is a London-based, Creandum-backed AI company that provides multimodal
  content classification and moderation as an API, analyzing video, image, audio,
  and text in context to detect harmful or policy-violating content at a scale of
  tens of millions of videos per day. The Unitary API at api.unitary.ai offers
  policy classification, granular Items and Characteristics signals, Detoxify
  text-toxicity scoring, and a Virtual Moderator endpoint that blends AI agents
  with human review, with results delivered by signed webhooks or polling. The
  company also maintains the popular open-source Detoxify Python library, and has
  expanded into AI Virtual Agents that automate manual workflows across insurance,
  financial services, healthcare, and marketplaces.
