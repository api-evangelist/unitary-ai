  /classify/policy/image/{job_id}:
    get:
      tags:
      - Policy Classification
      summary: Retrieve the results of a queued Policy classification job
      operationId: image_policy_classification_results_classify_policy_image__job_id__get
      parameters:
      - required: true
        schema:
          type: string
          format: uuid4
          title: Job Id
        name: job_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncResponse_PolicyClassificationResponse_'
        '404':
          description: Not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWTBearer: []
  /classify/items-characteristics/image:
    post:
      tags:
      - Items & Characteristics
      summary: Queue an image for Items & Characteristics classification
      description: 'This endpoint queues a job that predicts the Items & Characteristics
        categories of a single image.


        The request must contain either a file (a multi-part form encoded image file)
        or a `url` form field (a string containing a URL to download the image file
        from).


        Example CURL:

        ```

        curl --location --request POST https://api.unitary.ai/v1/classify/items-characteristics/image
        --header "Authorization: Bearer {API_TOKEN}" --header "Content-Type: multipart/form-data"
        --form "url={RESOURCE_URL}"

        ```


        A job ID will be returned in the response.


        If a `callback_url` form field is included in the request then the results
        webhook will be sent as a POST request to this URL once the image has been
        classified.


        Alternatively results can be obtained by making a GET request to the results
        endpoint using the job ID.


        **Webhooks should be implemented for any use of this endpoint at scale to
        prevent unnecessary polling of the results endpoint.**'
      operationId: image_items_characteristics_classify_classify_items_characteristics_image_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_image_items_characteristics_classify_classify_items_characteristics_image_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobIDResponse'
        '404':
          description: Not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWTBearer: []
  /classify/items-characteristics/image/{job_id}:
    get:
      tags:
      - Items & Characteristics
      summary: Retrieve the results of a queued Items & Characteristics classification
      description: 'This endpoint returns the results of a previously queued classify
        job.


        The response for each item is a prevalence score between 0 and 1 that represents
        how present it is in the content. 1 is highest prevalence and 0 is lowest
        prevalence.


        You can use these scores in mappings or models to implement safety policies,
        for example setting a numerical threshold for automated flagging of content
        or in a linear regression model.


        Note that the score meaning and distribution is different for each item: for
        example, a 0.7 for `pepe` won''t translate to the same likelihood of harmful
        content as a 0.7 for `confederate flag`.

        Therefore you should calculate an individual threshold for each item. For
        best performance, we suggest calculating a threshold using labelled data,
        optimising for the balance of precision and

        recall best suited to your needs. The Unitary team is happy to provide guidance
        on this process.'
      operationId: image_items_characteristics_results_classify_items_characteristics_image__job_id__get
      parameters:
      - required: true
        schema:
          type: string
          format: uuid4
          title: Job Id
        name: job_id
        in: path
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncResponse_ItemsCharacteristicsResponse_'
        '404':
          description: Not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - JWTBearer: []
